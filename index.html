<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prenotazione Mensa e Trasporti</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --secondary: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --danger: #dc2626;
      --success: #16a34a;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
    }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    h1, h2, h3 {
      color: var(--primary);
      margin-top: 0;
    }
    label {
      display: block;
      font-weight: 600;
      margin-top: 12px;
      margin-bottom: 4px;
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 16px;
    }
    .pasto-section {
      background: #f1f5f9;
      border-left: 4px solid var(--secondary);
      padding: 12px;
      margin-top: 12px;
      border-radius: 4px;
    }
    button.btn-submit {
      background-color: var(--primary);
      color: white;
      font-weight: bold;
      border: none;
      margin-top: 20px;
      cursor: pointer;
    }
    .notice {
      font-size: 13px;
      color: var(--danger);
      margin-top: 4px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 14px;
    }
    th, td {
      border: 1px solid #e2e8f0;
      padding: 8px;
      text-align: left;
    }
    th {
      background-color: var(--primary);
      color: white;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      color: white;
    }
    .badge-ok { background-color: var(--success); }
    .badge-full { background-color: var(--danger); }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <h1>Prenotazione Mensa</h1>
    <p class="notice">⚠️ Le prenotazioni chiudono con 2 giorni di anticipo rispetto alla data scelta.</p>
    
    <form id="bookingForm">
      <label for="nome">Nome e Cognome *</label>
      <input type="text" id="nome" required placeholder="Es. Mario Rossi">

      <label for="dataPasto">Data del Pasto *</label>
      <input type="date" id="dataPasto" required>

      <!-- SEZIONE PRANZO -->
      <div class="pasto-section">
        <h3>☀️ PRANZO</h3>
        <label for="pranzoPasto">Prenota Pranzo</label>
        <select id="pranzoPasto" onchange="toggleMezzo('pranzo')">
          <option value="NO">No</option>
          <option value="SI">Sì</option>
        </select>

        <div id="pranzoMezzoGroup" style="display:none;">
          <label for="pranzoMezzo">Tipologia Mezzo (Pranzo)</label>
          <select id="pranzoMezzo" onchange="checkTurni('pranzo')">
            <option value="PROPRIO">Mezzo Proprio</option>
            <option value="MILITARE">Mezzo Militare</option>
          </select>

          <div id="pranzoTurnoGroup" style="display:none;">
            <label for="pranzoTurno">Turno Navetta Militare (Max 9 persone)</label>
            <select id="pranzoTurno"></select>
          </div>
        </div>
      </div>

      <!-- SEZIONE CENA -->
      <div class="pasto-section">
        <h3>🌙 CENA</h3>
        <label for="cenaPasto">Prenota Cena</label>
        <select id="cenaPasto" onchange="toggleMezzo('cena')">
          <option value="NO">No</option>
          <option value="SI">Sì</option>
        </select>

        <div id="cenaMezzoGroup" style="display:none;">
          <label for="cenaMezzo">Tipologia Mezzo (Cena)</label>
          <select id="cenaMezzo" onchange="checkTurni('cena')">
            <option value="PROPRIO">Mezzo Proprio</option>
            <option value="MILITARE">Mezzo Militare</option>
          </select>

          <div id="cenaTurnoGroup" style="display:none;">
            <label for="cenaTurno">Turno Navetta Militare (Max 9 persone)</label>
            <select id="cenaTurno"></select>
          </div>
        </div>
      </div>

      <button type="submit" class="btn-submit">Conferma Prenotazione</button>
    </form>
  </div>

  <!-- TABELLA PUBBLICA RIEPILOGO -->
  <div class="card">
    <h2>📊 Riepilogo Prenotazioni Pubblico</h2>
    <div id="summary">
      <p>Seleziona o inserisci le prenotazioni per visualizzare lo stato dei turni e della lista passeggeri.</p>
    </div>
    <h3>Lista Prenotati</h3>
    <table id="tablePrenotazioni">
      <thead>
        <tr>
          <th>Nome</th>
          <th>Data</th>
          <th>Pranzo</th>
          <th>Cena</th>
        </tr>
      </thead>
      <tbody>
        <!-- Popolato via JS -->
      </tbody>
    </table>
  </div>
</div>

<script>
  // Imposta la data minima a 2 giorni da oggi
  const dataInput = document.getElementById('dataPasto');
  const today = new Date();
  const minDate = new Date(today);
  minDate.setDate(minDate.getDate() + 2);
  dataInput.min = minDate.toISOString().split('T')[0];

  // Gestione memoria locale prenotazioni
  let prenotazioni = JSON.parse(localStorage.getItem('prenotazioni_mensa')) || [];

  function toggleMezzo(tipo) {
    const pastoVal = document.getElementById(tipo + 'Pasto').value;
    const mezzoGroup = document.getElementById(tipo + 'MezzoGroup');
    mezzoGroup.style.display = pastoVal === 'SI' ? 'block' : 'none';
    if (pastoVal === 'SI') {
      checkTurni(tipo);
    }
  }

  function checkTurni(tipo) {
    const mezzoVal = document.getElementById(tipo + 'Mezzo').value;
    const turnoGroup = document.getElementById(tipo + 'TurnoGroup');
    const selectTurno = document.getElementById(tipo + 'Turno');
    const dataSelezionata = dataInput.value;

    if (mezzoVal !== 'MILITARE') {
      turnoGroup.style.display = 'none';
      return;
    }

    turnoGroup.style.display = 'block';
    selectTurno.innerHTML = '';

    // Conteggio posti occupati per data e tipo pasto
    const postiPerTurno = { 1: 0, 2: 0, 3: 0 };
    prenotazioni.forEach(p => {
      if (p.data === dataSelezionata) {
        if (tipo === 'pranzo' && p.pranzoMezzo === 'MILITARE') {
          postiPerTurno[p.pranzoTurno] = (postiPerTurno[p.pranzoTurno] || 0) + 1;
        }
        if (tipo === 'cena' && p.cenaMezzo === 'MILITARE') {
          postiPerTurno[p.cenaTurno] = (postiPerTurno[p.cenaTurno] || 0) + 1;
        }
      }
    });

    for (let t = 1; t <= 3; t++) {
      const occupati = postiPerTurno[t] || 0;
      const opt = document.createElement('option');
      opt.value = t;
      if (occupati >= 9) {
        opt.text = `Turno ${t} - COMPLETO (9/9)`;
        opt.disabled = true;
      } else {
        opt.text = `Turno ${t} (${occupati}/9 posti occupati)`;
      }
      selectTurno.appendChild(opt);
    }
  }

  dataInput.addEventListener('change', () => {
    checkTurni('pranzo');
    checkTurni('cena');
    aggiornaTabella();
  });

  document.getElementById('bookingForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const nuovaPrenotazione = {
      nome: document.getElementById('nome').value,
      data: dataInput.value,
      pranzoPasto: document.getElementById('pranzoPasto').value,
      pranzoMezzo: document.getElementById('pranzoPasto').value === 'SI' ? document.getElementById('pranzoMezzo').value : 'N/A',
      pranzoTurno: (document.getElementById('pranzoPasto').value === 'SI' && document.getElementById('pranzoMezzo').value === 'MILITARE') ? document.getElementById('pranzoTurno').value : 'N/A',
      cenaPasto: document.getElementById('cenaPasto').value,
      cenaMezzo: document.getElementById('cenaPasto').value === 'SI' ? document.getElementById('cenaMezzo').value : 'N/A',
      cenaTurno: (document.getElementById('cenaPasto').value === 'SI' && document.getElementById('cenaMezzo').value === 'MILITARE') ? document.getElementById('cenaTurno').value : 'N/A'
    };

    prenotazioni.push(nuovaPrenotazione);
    localStorage.setItem('prenotazioni_mensa', JSON.stringify(prenotazioni));
    alert('Prenotazione registrata con successo!');
    this.reset();
    aggiornaTabella();
  });

  function aggiornaTabella() {
    const tbody = document.querySelector('#tablePrenotazioni tbody');
    tbody.innerHTML = '';
    
    prenotazioni.forEach(p => {
      const tr = document.createElement('tr');
      const dettPranzo = p.pranzoPasto === 'SI' ? `Sì (${p.pranzoMezzo}${p.pranzoTurno !== 'N/A' ? ' T' + p.pranzoTurno : ''})` : 'No';
      const dettCena = p.cenaPasto === 'SI' ? `Sì (${p.cenaMezzo}${p.cenaTurno !== 'N/A' ? ' T' + p.cenaTurno : ''})` : 'No';
      
      tr.innerHTML = `
        <td>${p.nome}</td>
        <td>${p.data}</td>
        <td>${dettPranzo}</td>
        <td>${dettCena}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  // Inizializzazione
  aggiornaTabella();
</script>

</body>
</html>
